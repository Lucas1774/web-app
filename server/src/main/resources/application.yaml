security:
  ip-address: ${SOME_IP_ADDRESS}
  api-key: ${API_KEY}

scheduler:
  market-data-cron: "0 0 0 * * *" # Every day at midnight UTC
  news-recommendations-cron: "0 15 9 * * *" # Every day before the market opens
  recommendation-inference-five-cron: "0 35 9 * * *" # Every day after the market opens
  recommendation-inference-fifteen-cron: "0 45 9 * * *" # Every day after the market opens

spring:
  application:
    name: server
  profiles:
    active: ${SPRING_PROFILE}
  security:
    user:
      name: ${SPRING_USER}
      password: ${SPRING_PASSWORD}
    admin: ${ADMIN_USERS}
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  task:
    scheduling:
      pool:
        size: 4
  jpa:
    open-in-view: false

management:
  endpoints:
    access:
      default: none

mqtt:
  broker: ${MQTT_BROKER}
  username: ${MQTT_USER}
  password: ${MQTT_PASSWORD}
  topics:
    jobs: jobs

ai:
  # Defaults:
  # fix-me: false
  # chunk-size: 5
  # max-tokens: 8000
  # temperature: 0 for openrouter, null otherwise
  # thinking-level: high for google, null otherwise
  # requests-per-minute: 20 for openrouter (not configurable here), null otherwise
  # concurrent-requests: requests-per-minute for google and openrouter (not configurable here), null otherwise
